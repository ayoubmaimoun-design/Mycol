<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الموقع الاحترافي الشامل</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
}

nav {
  background: #111827;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  background: #38bdf8;
}

.section {
  display: none;
  padding: 20px;
}

.card {
  background: #1f2937;
  padding: 15px;
  margin: 10px auto;
  width: 80%;
  border-radius: 10px;
}

/* لعبة الثعبان */
#gameArea {
  width: 200px;
  height: 200px;
  background: #111827;
  margin: auto;
  position: relative;
}

#snake {
  width: 20px;
  height: 20px;
  background: lime;
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<nav>
  <div>🚀 الموقع الشامل</div>
  <button onclick="show('home')">الرئيسية</button>
</nav>

<!-- 🏠 الرئيسية -->
<div id="home" class="section" style="display:block;">
  <h1>اختر القسم</h1>

  <button onclick="show('games')">🎮 ألعاب</button>
  <button onclick="show('news')">📰 أخبار</button>
  <button onclick="show('login')">🔐 تسجيل الدخول</button>
  <button onclick="show('ads')">💰 إعلانات</button>
</div>

<!-- 🎮 الألعاب -->
<div id="games" class="section">
  <h2>🎮 ألعاب بسيطة</h2>

  <div class="card">
    <h3>Snake</h3>
    <div id="gameArea">
      <div id="snake"></div>
    </div>
    <button onclick="moveSnake()">تحريك</button>
  </div>

  <div class="card">
    <h3>Racing (عداد)</h3>
    <p>اضغط لزيادة السرعة</p>
    <button onclick="speed()">🚗 تسريع</button>
    <p id="speed">0 km/h</p>
  </div>
</div>

<!-- 📰 الأخبار -->
<div id="news" class="section">
  <h2>📰 أخبار (RSS)</h2>
  <div id="newsBox">جاري التحميل...</div>
</div>

<!-- 🔐 تسجيل الدخول -->
<div id="login" class="section">
  <h2>🔐 تسجيل دخول</h2>

  <input id="user" placeholder="اسم المستخدم">
  <br><br>
  <input id="pass" type="password" placeholder="كلمة المرور">
  <br><br>

  <button onclick="login()">دخول</button>
  <p id="msg"></p>
</div>

<!-- 💰 الإعلانات -->
<div id="ads" class="section">
  <h2>💰 مكان الإعلانات</h2>
  <div class="card">
    هنا توضع إعلانات AdSense لاحقاً
  </div>
</div>

<script>

function show(id){
  document.querySelectorAll('.section').forEach(s => s.style.display="none");
  document.getElementById(id).style.display="block";
}

/* 🔐 تسجيل دخول بسيط */
function login(){
  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;

  if(u && p){
    document.getElementById("msg").innerText = "تم الدخول ✔️ (تجريبي)";
  } else {
    document.getElementById("msg").innerText = "❌ أدخل البيانات";
  }
}

/* 🚗 لعبة السرعة */
let spd = 0;
function speed(){
  spd += 10;
  document.getElementById("speed").innerText = spd + " km/h";
}

/* 🐍 حركة بسيطة */
let x = 0;
function moveSnake(){
  x += 20;
  document.getElementById("snake").style.left = x + "px";
}

/* 📰 أخبار RSS */
fetch("https://rss.nytimes.com/services/xml/rss/nyt/World.xml")
.then(res => res.text())
.then(data => {
  let parser = new DOMParser();
  let xml = parser.parseFromString(data, "text/xml");
  let items = xml.querySelectorAll("item");

  let html = "";
  items.forEach((item, i) => {
    if(i < 5){
      html += `
        <div class="card">
          <h3>${item.querySelector("title").textContent}</h3>
        </div>
      `;
    }
  });

  document.getElementById("newsBox").innerHTML = html;
});

</script>

</body>
</html>
